name: hermes-msn
label: Hermes XP MSN Messenger
kind: platform
version: 0.5.1
description: "HermesXP MSN messaging plus verified native WLM2009 incoming voice calls using MSNP18/SSO, tunneled SIP and RTP/PCMU. Original Call toolbar uses a reciprocal native-call fallback due to unsupported legacy VOIP service."
requires_env:
  - name: HERMES_MSN_BRIDGE_TOKEN
    description: Long random secret shared only between the Hermes plugin and the local MSN bridge process
    password: true
  - name: HERMES_MSN_OWNER_EMAIL
    description: Only this MSN address may send messages to Hermes (lowercase)
    password: false
optional_env:
  - name: HERMES_MSN_NATIVE_CALL
    description: Opt-in native Messenger SIP/RTP handler (requires MSN_BOT_PROTOCOL=18 for WLM2009)
    password: false
  - name: MSN_BOT_PROTOCOL
    description: Set to 18 for WLM2009 MSNP18/SSO voice, or 13 for limited peer signaling; default 9 for stable text chat
    password: false
  - name: HERMES_MSN_NATIVE_IP
    description: Private LAN IPv4 address to advertise in SIP/SDP and bind RTP/UDP on the Hermes host
    password: false
  - name: HERMES_XP_VOICE_BIND
    description: Private Hermes LAN IPv4 address for the separate authenticated speech endpoint (default detected from host)
    password: false
  - name: HERMES_XP_PROBE_BIND
    description: Optional local LAN IPv4 bind address for read-only XP connectivity checks (leave blank to disable)
    password: false
  - name: MSN_SERVER_HOST
    description: MSN server the bridge connects to (installer default 127.0.0.1 = local server; leave unset for Escargot)
    password: false
  - name: MSN_LOGIN_URL
    description: Passport login URL the bridge uses (installer default http://127.0.0.1:8081/login = local server)
    password: false
