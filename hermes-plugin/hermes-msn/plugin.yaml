name: hermes-msn
label: Hermes XP MSN Messenger
kind: platform
version: 0.8.0
description: "Windows XP companion with native Messenger Call-button rendezvous, authenticated Hermes call controls, LAN recovery and MSN audio."
provides_tools:
  - msn_call
  - xp_status
  - xp_screen
  - xp_control
  - xp_service
requires_env:
  - name: HERMES_MSN_BRIDGE_TOKEN
    description: Long random secret shared only between the Hermes plugin and the local MSN bridge process
    password: true
  - name: HERMES_MSN_OWNER_EMAIL
    description: Only this MSN address may send messages to Hermes (lowercase)
    password: false
optional_env:
  - name: HERMES_MSN_NATIVE_CALL
    description: Opt-in native Messenger SIP/RTP handler (requires MSN_BOT_PROTOCOL=18 for WLM2009)
    password: false
  - name: MSN_BOT_PROTOCOL
    description: Set to 18 for WLM2009 MSNP18/SSO voice, or 13 for limited peer signaling; default 9 for stable text chat
    password: false
  - name: HERMES_MSN_NATIVE_IP
    description: Private LAN IPv4 address to advertise in SIP/SDP and bind RTP/UDP on the Hermes host
    password: false
  - name: HERMES_XP_TALK_TARGET
    description: Optional authorized Hermes Talk task target (required for GPT-Live mode). Configure on the host in private msn-bridge.env.
    password: false
  - name: HERMES_XP_TALK_DIRECT_TOOLS
    description: Set to 1 to let native MSN voice use a foreground Hermes CLI action with host tool/approval permissions. Requires explicitly trusted private paired XP and Talk fork v0.22.3+. Mutually exclusive with HERMES_XP_TALK_TARGET.
    password: false
  - name: HERMES_XP_TALK_PEER
    description: Optional Talk task peer for target selection (default local)
    password: false
  - name: HERMES_XP_TALK_PROFILE
    description: Optional Talk task profile for target selection (default default)
    password: false
  - name: HERMES_XP_PROBE_BIND
    description: Optional local LAN IPv4 bind address for read-only XP connectivity checks (leave blank to disable)
    password: false
  - name: MSN_SERVER_HOST
    description: MSN server the bridge connects to (installer default 127.0.0.1 = local server; leave unset for Escargot)
    password: false
  - name: MSN_LOGIN_URL
    description: Passport login URL the bridge uses (installer default http://127.0.0.1:8081/login = local server)
    password: false
  - name: HERMESXP_RELEASE_REPOSITORY
    description: Optional GitHub owner/repository containing verified release artifacts for this fork (host-only); defaults to the HermesXP upstream repository.
    password: false
  - name: HERMESXP_ASSET_SOURCE
    description: Host artifact policy (auto, build, or release); auto falls back to a local compile when no matching verified release exists.
    password: false
  - name: HERMES_CUA_LIVE_ENABLED
    description: Explicit opt-in to allow XP desktop input and Windows service writes via native Hermes tools. Defaults to disabled.
    password: false
  - name: HERMESXP_VISION_BACKEND
    description: Optional xp_screen vision backend on Hermes host (llama-cli, openai-compatible, disabled).
    password: false
  - name: HERMESXP_VISION_MODEL
    description: Optional GGUF model filename for llama-cli backend (default LFM3-VL). Other models need a matching projector.
    password: false
  - name: HERMESXP_VISION_ROOT
    description: Optional local model/runtime root directory (defaults to ~/local-multimodal on the host).
    password: false
  - name: HERMESXP_VISION_MODEL_PATH
    description: Optional absolute or model-directory-relative GGUF path for xp_screen analysis.
    password: false
  - name: HERMESXP_VISION_PROJECTOR_PATH
    description: Optional matching multimodal projector path for the chosen GGUF model.
    password: false
  - name: HERMESXP_VISION_LLAMA_CLI
    description: Optional llama-cli binary path for screenshot inference.
    password: false
  - name: HERMESXP_VISION_FFMPEG_DIR
    description: Optional directory containing ffmpeg for compatible local multimodal runtimes.
    password: false
  - name: HERMESXP_VISION_LIBRARY_PATH
    description: Optional dynamic library search paths for local llama-cli runtime.
    password: false
  - name: HERMESXP_VISION_THREADS
    description: Optional local inference CPU thread count (1-32, default 4).
    password: false
  - name: HERMESXP_VISION_API_URL
    description: Explicit opt-in vision chat/completions URL (screenshot is transmitted to this endpoint).
    password: false
  - name: HERMESXP_VISION_API_MODEL
    description: Model ID served by the selected OpenAI-compatible vision endpoint.
    password: false
  - name: HERMESXP_VISION_API_KEY
    description: Optional bearer key for the configured vision endpoint; keep on host, never on XP.
    password: true
