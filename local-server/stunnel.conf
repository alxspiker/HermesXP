; HermesXP local MSN TLS terminator.
; WLM 2009 on the XP signs in over HTTPS (login.live.com is re-routed to
; this box by the Switcher). stunnel terminates TLS on :443 with the local
; CA-signed cert and forwards plain HTTP to the msn-server front (8081).
; TLS 1.0 + old ciphers are required for XP SP3 SChannel; OpenSSL 3 needs
; security level 0 for TLS 1.0. Bind only the selected LAN interface and
; restrict access with firewall rules on an isolated network. Run as a systemd user service
; (msn-tls.service) with foreground=yes.
foreground = yes
pid = __HOME__/.hermes/msn-server/stunnel.pid
sslVersionMin = TLSv1
sslVersionMax = TLSv1.2
ciphers = ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-SHA:AES256-SHA:DES-CBC3-SHA:@SECLEVEL=0
options = NO_SSLv2
cert = __HOME__/.hermes/msn-server/certs/server.pem
key = __HOME__/.hermes/msn-server/certs/server-key.pem

[msn-https]
accept = __LAN_IP__:443
connect = 127.0.0.1:8081
